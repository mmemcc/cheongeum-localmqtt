version: "3.8"

services:
  mongo:
    image: mongo:6.0
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - ./mongo-data:/data/db
    #   - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    command: ["mongod", "--replSet", "rs0"]
    networks:
      - cheongeum-net

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883" 
      - "9001:9001"
    volumes:
      - ./mosquitto:/mosquitto
    user: "${UID}:${GID}"
    networks:
      - cheongeum-net

  subscriber:
    build: ./subscriber
    container_name: subscriber
    depends_on:
      - mongo
      - mosquitto
    volumes:
      - ./subscriber:/app
    command: python3 main.py
    networks:
      - cheongeum-net
  
  websocket:
    build: ./websocket-server
    container_name: websocket-server
    depends_on:
      - mongo
    volumes:
      - ./websocket-server:/app
    ports:
      - "8765:8765"
    command: python3 -u server.py
    networks:
      - cheongeum-net

networks:
  cheongeum-net:
    